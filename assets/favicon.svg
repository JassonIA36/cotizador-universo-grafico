<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="planetGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F5AFBA"/>
      <stop offset="45%" stop-color="#E6284A"/>
      <stop offset="100%" stop-color="#6B2C79"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DB1C6" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#2AC5B4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8B4FC7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#070A12"/>
  <circle cx="50" cy="50" r="26" fill="url(#planetGrad)" filter="url(#glow)"/>
  <ellipse cx="42" cy="40" rx="3.5" ry="2.5" fill="#5C2A73" opacity="0.6"/>
  <ellipse cx="58" cy="56" rx="3" ry="2" fill="#5C2A73" opacity="0.5"/>
  <ellipse cx="50" cy="50" rx="42" ry="14" fill="none" stroke="url(#ringGrad)" stroke-width="3" transform="rotate(-20 50 50)"/>
</svg>
